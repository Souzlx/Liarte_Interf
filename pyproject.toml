[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "liarte-desktop"
version = "5.3.1rc2"
description = "LIARTE: plataforma nativa modular com Importações Comex Stat e Estoque"
requires-python = ">=3.11,<3.15"
dependencies = ["PySide6-Essentials==6.10.3", "shiboken6==6.10.3", "openpyxl==3.1.5", "et-xmlfile==2.0.0", "reportlab==4.4.9", "pypdf==6.10.0", "pillow==12.3.0", "charset-normalizer==3.5.2", "pbixray==0.15.5", "xpress8==0.1.1", "xpress9==0.3.9", "xmhuffman==0.3.2", "kaitaistruct==0.11", "numpy==2.3.5", "pandas==2.3.3", "apsw==3.54.1.0", "python-dateutil==2.9.0.post0", "six==1.17.0", "pytz==2026.2", "tzdata==2026.2", "waitress==3.0.2", "truststore==0.10.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
liarte_core = ["catalog.json", "data/*.liarte", "data/*.json"]
liarte_desktop = ["assets/*", "qml/*.qml", "qml/components/*.qml", "qml/components/qmldir"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.format]
quote-style = "double"
