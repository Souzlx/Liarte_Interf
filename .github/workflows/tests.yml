name: Testes de alterações
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - '*.py'
      - '*.cmd'
      - '*.spec'
      - '*requirements*.txt'
      - 'pyproject.toml'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - '*.py'
      - '*.cmd'
      - '*.spec'
      - '*requirements*.txt'
      - 'pyproject.toml'
      - '.github/workflows/**'
permissions:
  contents: read
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Instalar bibliotecas Qt do sistema
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt
      - name: Verificar dependências
        run: python -m pip check
      - name: Executar testes e ensaio de volume
        run: python verificar.py --headless --volume
