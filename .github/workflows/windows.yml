name: Validar e compilar LIARTE no Windows
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-2025
    env:
      PYTHONUTF8: '1'
      PYTHONFAULTHANDLER: '1'
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, Node 24
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64
      - name: Conferir Python resolvido pelos comandos dos fontes
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          import sys
          for executable in ('python', 'pythonw'):
              matches = subprocess.check_output(
                  ['cmd', '/d', '/c', 'where', executable], text=True
              ).splitlines()
              resolved = Path(matches[0]).resolve()
              assert resolved.parent == Path(sys.executable).resolve().parent, matches
              assert resolved.parent != Path.cwd().resolve(), matches
              print(f'{executable}: {resolved}')
      - name: Preparar dependências
        run: python -m pip install -r requirements-build.txt
      - name: Conferir interface e perfil no Windows
        shell: python
        run: |
          import os
          from pathlib import Path
          import sys
          import unittest
          os.environ["QT_QPA_PLATFORM"] = "offscreen"
          os.environ["QT_QUICK_BACKEND"] = "software"
          sys.path[:0] = [str(Path.cwd()), str(Path.cwd() / "src")]
          from liarte_desktop.qt_runtime import configure_windows_qt
          configure_windows_qt()
          suite = unittest.defaultTestLoader.loadTestsFromNames([
              "tests.test_runtime_profile",
              "tests.test_inventory_alerts_qml",
              "tests.test_inventory_compare_qml",
              "tests.test_inventory_performance_qml",
              "tests.test_ux_stock_filters",
              "tests.test_ux_navigation",
              "tests.test_ux_chart_interactions",
              "tests.test_stock_sorting",
              "tests.test_stock_sorting_qml",
              "tests.test_performance_sorting",
              "tests.test_comex.RealQtTests.test_native_save_dialog_opens_with_the_right_format",
          ])
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(0 if result.wasSuccessful() else 1)
      - name: Compilar e testar a pasta portátil
        run: python tools/build_windows.py
      - name: Disponibilizar pacote
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6, Node 24
        with:
          name: LIARTE_Desktop_Python_${{ matrix.python-version }}_Windows
          path: dist/LIARTE_Desktop
          include-hidden-files: true
