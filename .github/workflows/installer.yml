name: Validar instalador LIARTE no Windows
on:
  workflow_dispatch:
    inputs:
      publish_preview:
        description: Publicar a prévia somente após validar os quatro builds e o Setup
        type: boolean
        default: false
        required: false
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 35
    env:
      PYTHONUTF8: '1'
      PYTHONFAULTHANDLER: '1'
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, Node 24
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64
      - name: Preparar dependências
        run: python -m pip install -r requirements-build.txt
      - name: Verificar diálogo de restauração antes da compilação completa
        shell: python
        run: |
          import os, sys, unittest
          sys.path[:0] = [os.path.join(os.getcwd(), 'src'), os.getcwd()]
          os.environ['QT_QPA_PLATFORM'] = 'offscreen'
          os.environ['QT_QUICK_BACKEND'] = 'software'
          os.environ['PYTHONDONTWRITEBYTECODE'] = '1'
          sys.dont_write_bytecode = True
          from liarte_desktop.qt_runtime import configure_windows_qt
          configure_windows_qt()
          suite = unittest.defaultTestLoader.loadTestsFromName('tests.test_inventory_backup_qml')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          sys.exit(0 if result.wasSuccessful() else 1)
      - name: Compilar e testar a pasta portátil
        run: python tools/build_windows.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6, Node 24
        with:
          name: LIARTE_Desktop_Python_${{ matrix.python-version }}_Windows
          path: dist/LIARTE_Desktop
          include-hidden-files: true
  installer:
    needs: build
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      PYTHONFAULTHANDLER: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, Node 24
        with:
          python-version: '3.12'
          architecture: x64
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7, Node 24
        with:
          name: LIARTE_Desktop_Python_3.12_Windows
          path: verified_bundle
      - name: Preparar Inno Setup fixado e conferir integridade
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $download = Join-Path $env:RUNNER_TEMP 'innosetup-6.5.4.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_5_4/innosetup-6.5.4.exe' -OutFile $download
          $expected = 'fa73bf47a4da250d185d07561c2bfda387e5e20db77e4570004cf6a133cc10b1'
          if ((Get-FileHash $download -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'SHA256 do Inno Setup diverge do fornecedor.' }
          if ((Get-AuthenticodeSignature $download).Status -ne 'Valid') { throw 'A assinatura do compilador Inno Setup não foi validada.' }
          $directory = Join-Path $env:RUNNER_TEMP 'liarte-inno-6.5.4'
          $arguments = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/NOICONS', ('/DIR="' + $directory + '"'))
          $process = Start-Process -FilePath $download -ArgumentList $arguments -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Inno Setup terminou com código $($process.ExitCode)." }
          $compiler = Join-Path $directory 'ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler)) { throw 'Compilador Inno Setup ausente.' }
          "LIARTE_ISCC=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Compilar Setup da pasta portátil já validada
        run: python tools/build_installer.py --bundle verified_bundle --output instalador
      - name: Baixar versão anterior para ensaio de atualização
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v5.3.0 --repo "$env:GITHUB_REPOSITORY" --pattern LIARTE_Desktop_5.3.0_Windows_x64.zip --pattern SHA256SUMS.txt --dir baseline_download
      - name: Instalar, atualizar e desinstalar em perfil descartável
        run: |
          $version = python -c "from tools.build_installer import release_version; print(release_version())"
          python tools/test_installer_windows.py --setup "instalador/LIARTE_Desktop_${version}_Setup.exe" --baseline-archive baseline_download/LIARTE_Desktop_5.3.0_Windows_x64.zip --baseline-checksum baseline_download/SHA256SUMS.txt --workspace "$env:RUNNER_TEMP/liarte-setup-lifecycle" --output instalador/AUTOTESTE_SETUP.json --ci-profile
      - name: Disponibilizar Setup validado
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6, Node 24
        with:
          name: LIARTE_Setup_Validado
          path: instalador
      - name: Disponibilizar diagnósticos do ciclo de instalação
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6, Node 24
        with:
          name: LIARTE_Setup_Diagnosticos
          path: |
            instalador/AUTOTESTE_SETUP.json
            ${{ runner.temp }}/liarte-setup-lifecycle/*.log
            ${{ runner.temp }}/liarte-setup-lifecycle/*-smoke.json
          if-no-files-found: ignore
  preview:
    if: ${{ inputs.publish_preview && github.ref == 'refs/heads/main' }}
    needs: [build, installer]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7, Node 24
        with:
          name: LIARTE_Desktop_Python_3.12_Windows
          path: verified_bundle
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7, Node 24
        with:
          name: LIARTE_Setup_Validado
          path: verified_setup
      - name: Conferir Setup e preparar pacote portátil e checksums
        shell: python
        run: |
          import os, sys
          sys.path.insert(0, os.getcwd())
          from pathlib import Path
          from tools.build_installer import installer_name, release_version
          from tools.test_installer_windows import prepare_preview_assets
          result = prepare_preview_assets(Path('verified_bundle'), Path('verified_setup') / installer_name(release_version()), Path('verified_setup/AUTOTESTE_SETUP.json'), Path('preview_assets'))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              for key, value in result.items():
                  output.write(f'{key}={value}\n')
        id: package
      - name: Publicar prévia validada
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.package.outputs.tag }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
          SETUP: ${{ steps.package.outputs.setup }}
          CHECKSUM: ${{ steps.package.outputs.checksum }}
        run: |
          set -euo pipefail
          existing_tag="$(git ls-remote origin "refs/tags/$TAG")"
          if [ -n "$existing_tag" ]; then
            echo "::error::A tag $TAG já existe; a publicação não será substituída."
            exit 1
          fi
          gh release create "$TAG" "$ARCHIVE" "$SETUP" "$CHECKSUM" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "LIARTE ${TAG#v} — instalador em validação" \
            --notes-file "docs/RELEASE_${TAG#v}.md" --prerelease --latest=false
