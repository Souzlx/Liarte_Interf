name: Validar organização do repositório
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: repository-${{ github.ref }}
  cancel-in-progress: true
jobs:
  repository:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, Node 24
        with:
          python-version: '3.12'
      - name: Verificar arquivos e links locais
        run: python tools/check_repository.py
      - name: Testar as ferramentas de manutenção
        run: python -m unittest discover -s tests/repository -p 'test_*.py' -v
